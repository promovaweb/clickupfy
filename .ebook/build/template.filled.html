<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>$title$</title>
<style>

 * Edite este arquivo somente ao substituir os binários e suas licenças.
 */
@font-face {
  font-family: "Inter";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("../../brand/fonts/inter-latin.woff2") format("woff2");
}

@font-face {
  font-family: "Inter";
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url("../../brand/fonts/inter-latin.woff2") format("woff2");
}

@font-face {
  font-family: "Inter";
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url("../../brand/fonts/inter-latin.woff2") format("woff2");
}

@font-face {
  font-family: "Inter";
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url("../../brand/fonts/inter-latin.woff2") format("woff2");
}

@font-face {
  font-family: "Manrope";
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url("../../brand/fonts/manrope-latin.woff2") format("woff2");
}

@font-face {
  font-family: "Manrope";
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url("../../brand/fonts/manrope-latin.woff2") format("woff2");
}

@font-face {
  font-family: "Manrope";
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url("../../brand/fonts/manrope-latin.woff2") format("woff2");
}

  font-family: "Manrope";

  src: url("../../brand/fonts/manrope-latin.woff2") format("woff2");
}

</style>
</head>
<body>

<div class="cover">
  <img class="cover-mark" src="../brand/logo/icon.svg" alt="Logo do ClickUpfy">
  <div class="cover-title">
    <div class="cover-kicker">ClickUpfy</div>
    <h1>Guia completo<br>do usuário</h1>
    <div class="cover-tagline">Planeje. Execute. Comprove.</div>
    <div class="cover-desc">Do ClickUp ao terminal e ao agente, com escopo, contexto e evidência.</div>
  </div>
  <div class="cover-meta">
    <div>Edição v$version$</div>
    <div>Gerado em $date$</div>
    <div>Fonte editorial: docs/user/</div>
  </div>
</div>

$if(toc)$
<nav id="TOC" role="doc-toc">
$toc$
</nav>
$endif$

<main>
$body$
</main>

</body>
</html>
