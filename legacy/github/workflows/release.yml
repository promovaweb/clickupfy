name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Preparar ou publicar release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Executar Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Identificar branch da Release PR
        id: release-pr
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: echo "branch=$(jq -r .headBranchName <<< "$RELEASE_PR")" >> "$GITHUB_OUTPUT"

      - name: Obter Release PR
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Normalizar changelog
        if: steps.release.outputs.prs_created == 'true'
        run: node scripts/normalize-changelog.mjs

      - name: Registrar normalização
        if: steps.release.outputs.prs_created == 'true'
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "style: normaliza changelog da release"
          git push

  executaveis:
    name: Executável ${{ matrix.nome }}
    if: needs.release-please.outputs.release_created == 'true'
    needs: release-please
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Linux x64
            id: linux-x64
            os: ubuntu-latest
            arquitetura: x64
          - nome: macOS x64
            id: macos-x64
            os: macos-15-intel
            arquitetura: x64
          - nome: macOS arm64
            id: macos-arm64
            os: macos-15
            arquitetura: arm64
          - nome: Windows x64
            id: windows-x64
            os: windows-latest
            arquitetura: x64
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Obter commit da release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Configurar Node.js nativo
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          architecture: ${{ matrix.arquitetura }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar projeto e tag
        run: npm run typecheck && npm run build && npm run release:check -- "${{ needs.release-please.outputs.tag_name }}"
        shell: bash

      - name: Gerar executável standalone
        id: executavel
        run: npm run build:executable

      - name: Atestar proveniência
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.executavel.outputs.archive_path }}

      - name: Guardar archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.id }}
          path: ${{ steps.executavel.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 7

  publicar-assets:
    name: Publicar artefatos
    if: needs.release-please.outputs.release_created == 'true'
    needs:
      - release-please
      - executaveis
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
    steps:
      - name: Obter commit da release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Instalar dependências
        run: npm ci

      - name: Baixar executáveis
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Preparar binários do pacote npm
        run: npm run npm:stage -- release-assets

      - name: Empacotar distribuição npm
        run: npm pack --pack-destination release-assets

      - name: Validar instalação npm nativa
        run: npm run npm:validate-package -- "release-assets/promovaweb-clickupfy-${{ needs.release-please.outputs.version }}.tgz"

      - name: Gerar checksums
        run: node scripts/generate-checksums.mjs release-assets

      - name: Atestar conjunto publicado
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Anexar arquivos à GitHub Release
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release-assets/* --clobber

      - name: Publicar pacote no npm
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run publish:npm -- "release-assets/promovaweb-clickupfy-${{ needs.release-please.outputs.version }}.tgz"
